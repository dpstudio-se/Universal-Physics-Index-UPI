name: UPI System Health Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run fail-closed system audit
        run: python tools/upi_system_audit.py
      - name: Run governed system tests
        run: pytest tests/test_governed_system.py tests/test_schema.py tests/test_workflow.py -q
      - name: Run full tests
        run: pytest tests -q
      - name: Run lint
        run: ruff check src tests tools
      - name: Run type check
        run: mypy src/upi --ignore-missing-imports
