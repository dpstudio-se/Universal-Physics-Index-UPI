name: RNA Delta

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Optional base commit SHA for a manual delta report"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  delta:
    name: Report DNA changes for RNA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build RNA delta report
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="${MANUAL_BASE_SHA:-$EVENT_BEFORE}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          def read_json(path: str, revision: str | None = None) -> dict:
              if revision:
                  raw = git("show", f"{revision}:{path}")
              else:
                  raw = Path(path).read_text(encoding="utf-8")
              return json.loads(raw)

          def slug(address: str) -> str:
              value = re.sub(r"[^a-z0-9]+", "-", address.lower()).strip("-")
              return value

          def existed(revision: str, path: str) -> bool:
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{revision}:{path}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0

          changes = []
          for line in git("diff", "--name-status", base, head, "--", "data").splitlines():
              if not line:
                  continue
              status, path = line.split("\t", 1)
              if not path.endswith(".json"):
                  continue
              if status == "D":
                  record = read_json(path, base)
              else:
                  record = read_json(path)
              parts = Path(path).parts
              domain = parts[1] if len(parts) > 1 else "unknown"
              is_new = status == "A"
              new_domain = is_new and not existed(base, f"data/{domain}")
              new_stop_group = is_new and record.get("status") == "STOP"
              new_source = is_new and domain == "sources"
              needs_surface = new_domain or new_stop_group or new_source
              if needs_surface:
                  reasons = []
                  if new_domain:
                      reasons.append("new domain")
                  if new_stop_group:
                      reasons.append("new STOP group")
                  if new_source:
                      reasons.append("new source")
                  ui = "needs-surface"
                  note = "; ".join(reasons) + "; review RNA UI inbox"
              else:
                  ui = "Catalog (auto)"
                  note = "Catalog/Graph can transcribe this node"
              changes.append(
                  (head, path, slug(record.get("address", path)), record.get("status", "UNKNOWN"), ui, note)
              )

            lines = [
              "| SHA | File | Slug | Status | UI | Note |",
              "|---|---|---|---|---|---|",
          ]
          if changes:
              lines.extend("| " + " | ".join(row) + " |" for row in changes)
          else:
              lines.append("| " + " | ".join([head, "(no data JSON changes)", "—", "—", "Catalog (auto)", "No RNA surface change"])+ " |")
          Path("rna-delta.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(Path("rna-delta.md").read_text(encoding="utf-8"))

      - name: Upload delta artifact
        uses: actions/upload-artifact@v4
        with:
          name: rna-delta
          path: rna-delta.md

      - name: Comment on RNA UI inbox
        uses: actions/github-script@v7
        env:
          DELTA_REPORT: rna-delta.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.DELTA_REPORT, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body
            });