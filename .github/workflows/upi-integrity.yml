name: UPI Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Validate canonical data
        run: python -m upi.cli validate data

      - name: Check UPI graph
        run: python -m upi.cli graph data

      - name: Run Python tests
        run: python -m pytest tests -q

      - name: Lint
        if: matrix.python-version == '3.13'
        run: ruff check src tests

      - name: Type check
        if: matrix.python-version == '3.13'
        run: mypy src/upi --ignore-missing-imports

  research-gates:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Validate research session schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft7Validator

          schema = json.loads(Path('schemas/research-session.schema.json').read_text(encoding='utf-8'))
          validator = Draft7Validator(schema)
          targets = list(Path('examples').rglob('*.json')) + list(Path('data').rglob('*.json'))
          failures = []
          for path in targets:
              try:
                  obj = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if obj.get('format') != 'upi-research-session':
                  continue
              errors = sorted(validator.iter_errors(obj), key=lambda e: list(e.path))
              if errors:
                  failures.append((str(path), [e.message for e in errors]))
          if failures:
              for path, errors in failures:
                  print(f'INVALID {path}')
                  for error in errors:
                      print(f'  - {error}')
              raise SystemExit(1)
          print('Research-session documents pass the declared schema.')
          PY

      - name: Check Viking saga research record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/cultural_history/viking_saga_odins_eye.json')
          obj = json.loads(path.read_text(encoding='utf-8'))
          assert obj['status'] == 'HYP'
          assert obj['evidence_status'] == 'STOP'
          assert obj['method_ref'] == 'docs/VIKING_SAGA_ODINS_EYE.md'
          allowed = {'EST', 'DER', 'HYP', 'STOP', 'ERR', 'SYM'}
          for claim in obj['claims']:
              assert claim['status'] in allowed, claim
          assert any(c['status'] == 'SYM' for c in obj['claims'])
          assert any(c['status'] == 'STOP' for c in obj['claims'])
          print('Viking saga research record integrity checks passed.')
          PY

      - name: Dimensional guard for physical/narrative frequency claims
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/VIKING_SAGA_ODINS_EYE.md').read_text(encoding='utf-8')
          required = [
              'f_{\\text{narrativ}}',
              'f_S\\approx7.83\\,Hz',
              'f_c=8.00\\,Hz',
              'dimensions',
              'null',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit('Missing research guard terms: ' + ', '.join(missing))
          print('Frequency-domain separation guard passed.')
          PY

  no_auto_promotion:
    runs-on: ubuntu-latest
    needs: research-gates
    steps:
      - name: Verify workflow policy
        run: |
          echo 'CI validates, tests and audits; it does not promote scientific status.'
          echo 'Human review remains required for canonical promotion.'
