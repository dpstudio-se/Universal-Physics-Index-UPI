name: UPI Elite Gate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  security-events: write

jobs:
  software:
    name: Software validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: UPI self-test
        run: python -m upi.cli self-test . --build
      - name: Canonical data
        run: python tools/validate_canonical_data.py
      - name: Model contract
        run: |
          test -s docs/UPI_MODEL_COMPATIBILITY_CONTRACT.md
          test -s docs/UPI_MODEL_WORKFLOW.md
          grep -q "source text as data" docs/UPI_MODEL_COMPATIBILITY_CONTRACT.md
          grep -q "fail closed" docs/UPI_MODEL_COMPATIBILITY_CONTRACT.md
          grep -q "software_test" docs/UPI_MODEL_COMPATIBILITY_CONTRACT.md
      - name: Lint
        run: ruff check src tests

  docker:
    name: Docker runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Docker build
        run: docker build --pull -t upi-elite-gate .
      - name: Docker smoke
        run: |
          docker run --rm -d --name upi-elite-smoke -p 18080:8080 upi-elite-gate
          trap 'docker logs upi-elite-smoke || true; docker rm -f upi-elite-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  security:
    name: Supply-chain security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table

  gate:
    name: Elite gate
    needs: [software, docker, security]
    runs-on: ubuntu-latest
    steps:
      - run: echo "UPI ELITE GATE PASSED"
