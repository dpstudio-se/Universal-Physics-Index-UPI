services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upi
      POSTGRES_USER: upi
      POSTGRES_PASSWORD: upi
    ports:
      - "5432:5432"
    volumes:
      - upi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upi -d upi"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      UPI_DATABASE_URL: postgresql://upi:upi@db:5432/upi
    depends_on:
      db:
        condition: service_healthy

volumes:
  upi_pg:
