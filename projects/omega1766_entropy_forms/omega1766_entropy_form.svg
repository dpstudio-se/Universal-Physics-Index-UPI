<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#050914"/>
<text x="700" y="55" fill="#e8d8a8" font-family="serif" font-size="34" text-anchor="middle">Ω1766 — ENTROPY / FREQUENCY / FORM</text>
<text x="700" y="88" fill="#9ccfff" font-family="sans-serif" font-size="18" text-anchor="middle">geometry → wave modes → energy transport → entropy production → observed form</text>

<circle cx="700" cy="430" r="185" fill="#071b38" stroke="#7ed7ff" stroke-width="3"/>
<path d="M515 430 C570 300 650 300 700 430 C750 560 830 560 885 430" fill="none" stroke="#54bfff" stroke-width="7"/>
<path d="M515 430 C570 560 650 560 700 430 C750 300 830 300 885 430" fill="none" stroke="#f1b85b" stroke-width="7"/>
<circle cx="700" cy="430" r="58" fill="#0d2d55" stroke="#f1d27b" stroke-width="2"/>
<text x="700" y="422" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle">EARTH</text>
<text x="700" y="450" fill="#bfe7ff" font-family="sans-serif" font-size="15" text-anchor="middle">open to energy</text>

<g font-family="sans-serif">
<rect x="45" y="125" width="390" height="245" rx="18" fill="#08172a" stroke="#49bfff"/>
<text x="70" y="165" fill="#fff" font-size="23">1. FREQUENCY</text>
<text x="70" y="205" fill="#bfe7ff" font-size="19">fS = 7.834125 Hz</text>
<text x="70" y="238" fill="#bfe7ff" font-size="19">f8 = 8.000000 Hz</text>
<text x="70" y="271" fill="#bfe7ff" font-size="19">Δf = 0.165875 Hz</text>
<text x="70" y="304" fill="#bfe7ff" font-size="19">Δf/f8 = 2.0734375%</text>
<text x="70" y="337" fill="#bfe7ff" font-size="19">Tbeat = 6.028636 s</text>

<rect x="965" y="125" width="390" height="245" rx="18" fill="#171006" stroke="#f1b85b"/>
<text x="990" y="165" fill="#fff" font-size="23">2. ENTROPY STATE</text>
<text x="990" y="205" fill="#ffe2a1" font-size="18">LOW → structure / symmetry</text>
<text x="990" y="238" fill="#ffe2a1" font-size="18">MID → spirals / repeated motifs</text>
<text x="990" y="271" fill="#ffe2a1" font-size="18">HIGH → branching / texture</text>
<text x="990" y="304" fill="#ffe2a1" font-size="18">DYNAMIC → fragmentation / variation</text>
<text x="990" y="342" fill="#fff" font-size="16">qualitative bands, not measured entropy</text>

<rect x="45" y="590" width="390" height="245" rx="18" fill="#08172a" stroke="#49bfff"/>
<text x="70" y="630" fill="#fff" font-size="23">3. THERMODYNAMICS</text>
<text x="70" y="680" fill="#bfe7ff" font-size="18">dSsystem/dt</text>
<text x="70" y="710" fill="#bfe7ff" font-size="18">= Ṡin − Ṡout + Ṡgen</text>
<text x="70" y="750" fill="#bfe7ff" font-size="18">Ṡgen ≥ 0</text>
<text x="70" y="792" fill="#fff" font-size="15">local order can emerge with entropy export</text>

<rect x="965" y="590" width="390" height="245" rx="18" fill="#171006" stroke="#f1b85b"/>
<text x="990" y="630" fill="#fff" font-size="23">4. MIRROR CONTROL</text>
<text x="990" y="680" fill="#ffe2a1" font-size="18">x → F(x) → G(F(x)) = x′</text>
<text x="990" y="715" fill="#ffe2a1" font-size="18">Δ = x′ − x</text>
<text x="990" y="750" fill="#ffe2a1" font-size="18">ε = |Δ| / max(|x|, scale)</text>
<text x="990" y="792" fill="#fff" font-size="15">closure ≠ physical validation</text>
</g>

<text x="700" y="870" fill="#8ea8c7" font-family="sans-serif" font-size="16" text-anchor="middle">EST = established • DER = derived • HYP = hypothesis • SYM = symbolic</text>
</svg>